name: Private Pilot CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable"
      WHOP_API_KEY: "test-key"
      NEXT_PUBLIC_WHOP_APP_ID: "test-app-id"
      WHOP_WEBHOOK_SECRET: "test-webhook-secret"
      APP_URL: "http://localhost:3000"
      STUDENT_LINK_SIGNING_SECRET: "test-signing-secret-at-least-32-chars"
      CRON_SECRET: "test-cron-secret"
      JOB_PROVIDER_SECRET: "test-job-secret"
      INNGEST_EVENT_KEY: "test-inngest-key"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Run production build
        run: bun run build
        env:
          NEXT_PUBLIC_WHOP_APP_ID: "test-app-id"
          NEXT_PUBLIC_POSTHOG_KEY: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
